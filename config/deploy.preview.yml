<%
  # ARMADILHA: o host nip.io e roteado SEMPRE; APP_DOMAIN so acrescenta. O
  # kamal-proxy roteia por cabecalho Host e o health check fala direto com o
  # container, entao trocar o nip.io por um dominio sem DNS deixa o app
  # inacessivel com o deploy VERDE.
  nip_host    = "#{ENV['INFRA_WEB_IP']}.nip.io"
  app_domains = ENV['APP_DOMAIN'].to_s.split(',').map(&:strip).reject(&:empty?)
  app_hosts   = ([nip_host] + app_domains).uniq
%>
servers:
  web:
    hosts:
      - <%= ENV['INFRA_WEB_IP'] %> # provision job exports web VM IP address INFRA_WEB_IP

env:
  clear:
    APP_ENV: preview
    SENTRY_TRACES_SAMPLE_RATE: "1" # workshop traffic is a room full of people, not production
    BASE_URL: https://<%= app_domains.first || nip_host %> # APP_DOMAIN when set, else nip.io
    # DEV_MODE e local-only: defini-lo aqui faz toda pagina devolver 404.
  secret:
    - DATABASE_URL # obtained from .kamal/secrets.preview
    - SENTRY_DSN # obtained from .kamal/secrets.preview (may be empty -> reporting disabled)

proxy:
  hosts: [<%= app_hosts.map(&:inspect).join(", ") %>]
  ssl: true # Let's Encrypt, one certificate per hostname

accessories:
  db:
    image: supabase/postgres:17.6.1.171 # see references/postgres-recipe.md
    host: <%= ENV['INFRA_DB_IP'] %> # provision job exports accessory IP address INFRA_db_IP
    port: "5432:5432"
    cmd: "postgres -D /etc/postgresql -c shared_buffers=512MB -c effective_cache_size=1536MB -c work_mem=5MB -c maintenance_work_mem=128MB -c max_connections=100"
    env:
      secret:
        - POSTGRES_PASSWORD # obtained from .kamal/secrets.preview
    directories:
      - /data/pgdata:/var/lib/postgresql/data # volume mount for accessory. Always mount at /data/<subdir>
