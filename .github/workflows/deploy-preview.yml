# .github/workflows/deploy-preview.yml
name: Deploy Preview
on:
  push:
    branches: [master]
    paths-ignore: [".claude/**"]

permissions:
  contents: read
  packages: write

jobs:
  infra:
    uses: locaweb/locaweb-cloud-provision/.github/workflows/provision.yml@v1
    with:
      env_name: "preview"
      zone: "ZP01"
      web_plan: "small"
      web_disk_size_gb: 20
      accessories: '[{"name":"db","plan":"small","disk_size_gb":20}]'
    secrets:
      CLOUDSTACK_API_KEY: ${{ secrets.CLOUDSTACK_API_KEY }}
      CLOUDSTACK_SECRET_KEY: ${{ secrets.CLOUDSTACK_SECRET_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  deploy:
    needs: infra
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4

      - name: Load infrastructure environment
        run: echo "${{ needs.infra.outputs.infra_env }}" >> "$GITHUB_ENV"

      - name: Set repo identity
        run: |
          echo "REPO_NAME=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "REPO_FULL=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Expose GHA cache env vars for Kamal's `docker buildx build --cache-from type=gha`.
      - uses: crazy-max/ghaction-github-runtime@v3

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: gem install kamal --no-document

      - name: Compose DATABASE_URL (Kamal does not expand $VAR inside composed values)
        run: |
          # O .kamal/secrets.preview tem DATABASE_URL com $POSTG...ORD, mas o Kamal
          # não expande variáveis DENTRO de um valor composto (só quando o valor
          # inteiro é $VAR). Montamos a DSN final aqui (senha do secret) e
          # sobrescrevemos a linha no arquivo. O repo é público, então a senha real
          # NUNCA é commitada — ela vive só no secret e no arquivo gerado no runner.
          {
            echo "POSTGRES_PASSWORD=$POSTG...WORD"
            echo "DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable"
            echo "SENTRY_DSN=${SENTRY_DSN:-}"
          } > .kamal/secrets.preview
          # garante permissão restrita
          chmod 600 .kamal/secrets.preview

      - name: Deploy with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure proxy is current: reboot if version changed, ignore if first run (no Docker yet)
          kamal proxy boot -d preview || kamal proxy reboot -y -d preview || true
          kamal setup -d preview
          kamal accessory reboot all -d preview

      # Image is cached via GHA, not the registry -- clean up to prevent storage accumulation
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.REPO_NAME }}
          package-type: container
          min-versions-to-keep: 1
